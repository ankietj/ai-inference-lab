[project]
name = "inference-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ankietj", email = "ankietj@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
inference-lab = "inference_lab:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
